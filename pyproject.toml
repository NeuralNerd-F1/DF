[tool.poetry]
name = "apex"
version = "0.1.0"
description = "APEX — F1 driver behavioural profiling platform (Failsafe Architecture Edition)"
authors = ["APEX"]
readme = "CLAUDE.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Python floor is 3.12: the exactly-pinned data deps require it (numpy 2.5.0 declares
# Requires-Python >=3.12), and the build env runs Python 3.14. The constitution text
# (CLAUDE.md) still says "Python 3.11" — that line is stale and tracked separately; the
# resolver contract lives here. With "^3.11" poetry could not resolve numpy at all.
# Heavy ML/runtime deps (FastAPI, pandas, xgboost, umap-learn, shap, mlflow, fastf1,
# sqlalchemy, ...) are added by the features that first import them — F00 only needs the
# contract layer's runtime deps.
python = "^3.12"
pydantic = "^2.7"
pyyaml = "^6.0"
# F01 ingestion: telemetry frames + Parquet cache. The constitution pins pandas 2.x /
# numpy 1.x, but the build environment here runs Python 3.14, which has no wheels for
# those — only pandas 3.x / numpy 2.x. Versions are pinned EXACTLY (not floated) so the
# run reproduces from the repo (non-negotiable #3). See the handover note on the skew.
# NOTE (F07): moved 2.5.0 -> 2.4.6 because SHAP's numba dep (numba 0.65.1) caps `numpy<2.5`.
# A cp314 wheel for 2.4.6 exists, so it still runs on Python 3.14; the full F01–F06 suite
# (351 tests) was re-run green on 2.4.6 before F07 was built. Transitive migration, same
# pattern F04 (pandas/numpy) and F06a (mlflow-skinny) set — ratified by F07.
numpy = "2.4.6"
pandas = "3.0.3"
pyarrow = "24.0.0"
# F06a classifier training. Versions pinned EXACTLY (reproducibility, non-negotiable #3) at the
# newest releases with Python-3.14 wheels. NOTE the constitution pins "XGBoost 2.x / Optuna 3.x /
# MLflow 2.x"; on Python 3.14 + pandas 3.x that is unbuildable — full `mlflow` caps `pandas<3`
# and would downgrade the F04-ratified stack. F06a therefore uses **mlflow-skinny** (the
# lightweight tracking + registry client, same `mlflow.*` API) on a sqlite store. This major-
# version migration is ratified by F06a, mirroring F04's numpy/pandas migration. SHAP is NOT
# added here — it is F07's dependency.
scikit-learn = "1.9.0"
xgboost = "3.3.0"
optuna = "4.9.0"
mlflow-skinny = "3.14.0"
# F07 SHAP explainability (§6). Newest release with a Python-3.14 wheel; pulls numba/llvmlite,
# which cap numpy<2.5 (see the numpy note above). TreeExplainer over the F06 champion's base
# XGBoost. Pinned EXACTLY for reproducibility (non-negotiable #3).
shap = "0.52.0"
# F08 Model 2 — driver style space (§5.2). Newest releases with Python-3.14 wheels; pinned EXACTLY
# for reproducibility (#3). umap-learn brings its pynndescent NN backend; scipy (already present via
# SHAP) is now a direct dependency for scipy.spatial.procrustes (§11.2 stability). No numpy movement
# — numba already caps numpy<2.5 (satisfied at 2.4.6). Transitive-migration pattern, ratified by F08.
umap-learn = "0.5.12"
pynndescent = "0.6.0"
scipy = "1.18.0"
# F12 persistence layer (§8.3/§8.4/§9). SQLAlchemy 2.0 async ORM + Alembic migrations, pinned EXACTLY
# for reproducibility (#3). greenlet (SQLAlchemy's async bridge) is transitive. NOTE the master §9
# names **asyncpg** as the driver; it ships NO Python-3.14 (cp314) wheel and needs MSVC to build from
# source (unavailable in this env), so F12 uses **psycopg v3 async** (postgresql+psycopg://) — a cp314
# binary wheel exists. Same ratified transitive-migration pattern F04 (pandas/numpy), F06a
# (mlflow-skinny) and F07 (numpy pin) set. The offline test suite is driver-independent (aiosqlite).
sqlalchemy = "2.0.51"
alembic = "1.18.5"
psycopg = { version = "3.3.4", extras = ["binary"] }
# F13 API serving layer (§8.5/§9). FastAPI + Pydantic v2 REST surface + Prometheus /metrics. Present
# in the venv ahead of pyproject; pinned EXACTLY here for reproducibility (#3) — the master pins
# "FastAPI 0.111+"; 0.138.1 is the installed cp314-compatible release. uvicorn is the ASGI server
# (run only; the test suite drives the app in-process via httpx, no live server). Same "the feature
# adds the dep it first imports" pattern as F01/F06a/F07/F12.
fastapi = "0.138.1"
starlette = "1.3.1"
uvicorn = "0.49.0"
prometheus-client = "0.25.0"
# F14 platform layer (§8.2/§8.3/§9). Redis cache + Celery task queue + replay engine. Pinned EXACTLY
# for reproducibility (#3) at the newest releases with Python-3.14 wheels — redis-py is pure-Python
# (redis.asyncio async client); celery pulls kombu/billiard/vine (billiard 4.2.4 ships a cp314 wheel,
# so the F12-psycopg wheel risk did NOT recur here). Redis is broker + result backend + cache. The
# offline suite is broker-independent (Celery always_eager) and cache-independent (fakeredis/FakeCache).
redis = "8.0.1"
celery = "5.6.3"
# F15 RQ5 failsafe harness (§11.4). The harness (app/eval/failsafe.py) is shipped code that DRIVES
# the assembled ASGI app under fault injection (incl. 50 concurrent requests via ASGITransport), so
# httpx moves from a dev-only test client (F13) to a MAIN dependency. Pinned EXACTLY (#3). F20 imports
# run_failsafe_suite from the same module.
httpx = "0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.5"
mypy = "^1.10"
types-pyyaml = "^6.0"
pandas-stubs = "3.0.3.260530"
# F12 — the offline DB test suite runs on aiosqlite (no Postgres needed); async tests via
# pytest-asyncio (asyncio_mode="auto"). Pinned EXACTLY (#3).
aiosqlite = "0.22.1"
pytest-asyncio = "1.4.0"
# F13 — httpx drives the FastAPI app in-process (TestClient + ASGITransport AsyncClient). Promoted to
# a MAIN dependency by F15 (the failsafe harness imports it); kept out of dev to avoid a duplicate pin.
# F14 — fakeredis backs the offline cache tests (in-process sync + async Redis, no server). Celery
# runs always_eager in tests (no broker/worker). Pinned EXACTLY (#3).
fakeredis = "2.36.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
# Lint floor kept at 3.11 (runtime floor is 3.12): bumping to py312 only adds PEP 695
# "type parameters" rewrite suggestions for already-correct DONE code — a separate
# modernization, deliberately out of scope for this dependency-resolution fix.
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

# F13 — FastAPI's dependency-injection idiom is `param: T = Depends(...)`, which B008 ("no function
# call in an argument default") flags. These calls are immutable markers, not mutable defaults — the
# whitelist is FastAPI's own recommended ruff config.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# We never import numpy directly (only via pandas), so skip following its stubs — this keeps
# the checked type surface tied to what we actually use and avoids coupling to numpy's stub
# churn. (Retained from the 3.11 era when those stubs were also unparseable at our target.)
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

# F06a ML stack — these ship no type stubs / py.typed marker. We pin exact versions
# (reproducibility) but ignore their missing stubs so strict mypy stays green on our own code
# without coupling to third-party stub churn (same rationale as the numpy override above).
[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "shap.*", "scipy.*", "umap.*", "pynndescent.*"]
ignore_missing_imports = true

# F12 — aiosqlite ships no py.typed marker (used only as a test driver, never imported by app code).
# SQLAlchemy / Alembic / psycopg all ship py.typed, so they stay under strict checking.
[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true

# F14 — celery / fakeredis ship no usable py.typed surface for strict checking; redis-py ships
# py.typed and stays strict. fakeredis is a test-only driver (never imported by app code).
[[tool.mypy.overrides]]
module = ["celery.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# F12 — async DB tests: asyncio_mode="auto" runs plain `async def test_` with no per-test marker.
asyncio_mode = "auto"
# Registered markers. `postgres` gates the real-Postgres migration round-trip test, skipped
# unless database.test_dsn_env_var (APEX_TEST_DATABASE_URL) is set.
markers = [
    "postgres: integration test requiring a live PostgreSQL (skipped unless APEX_TEST_DATABASE_URL set)",
    "redis: integration test requiring a live Redis (skipped unless APEX_REDIS_URL set)",
    "celery: integration test requiring a live Celery broker/worker (skipped unless APEX_CELERY_BROKER_URL set)",
    "artefacts: F15 test needing committed model artefacts (skipped unless classifier.pkl / umap_model.pkl present)",
]
