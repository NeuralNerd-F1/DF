# Alembic config (F12). The DSN is NOT here — it is a secret resolved in migrations/env.py from
# the environment variable named by database.dsn_env_var (§9 RLS / secret hygiene). script_location
# points at the migrations/ package; env.py wires the async engine + Base.metadata.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Static, timezone-naive revision filenames — no wall-clock in generated names (reproducibility #3).
# (The baseline is hand-authored; future revisions are autogenerated.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
