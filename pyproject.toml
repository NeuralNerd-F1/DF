[tool.poetry]
name = "apex"
version = "0.1.0"
description = "APEX — F1 driver behavioural profiling platform (Failsafe Architecture Edition)"
authors = ["APEX"]
readme = "CLAUDE.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Constitution pins Python 3.11. Heavy ML/runtime deps (FastAPI, pandas, xgboost,
# umap-learn, shap, mlflow, fastf1, sqlalchemy, ...) are added by the features that
# first import them — F00 only needs the contract layer's runtime deps.
python = "^3.11"
pydantic = "^2.7"
pyyaml = "^6.0"
# F01 ingestion: telemetry frames + Parquet cache. The constitution pins pandas 2.x /
# numpy 1.x, but the build environment here runs Python 3.14, which has no wheels for
# those — only pandas 3.x / numpy 2.x. Versions are pinned EXACTLY (not floated) so the
# run reproduces from the repo (non-negotiable #3). See the handover note on the skew.
numpy = "2.5.0"
pandas = "3.0.3"
pyarrow = "24.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.5"
mypy = "^1.10"
types-pyyaml = "^6.0"
pandas-stubs = "3.0.3.260530"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# numpy 2.x ships stubs that use 3.12+ `type` syntax, unparseable under our 3.11
# target. We never import numpy directly (only via pandas), so skip following it.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
