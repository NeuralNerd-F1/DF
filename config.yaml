# APEX configuration — the single source of truth for constants.
#
# The constitution bans magic numbers: every seed, threshold, and path is read from
# here through app/contracts/config.py. F00 seeds the foundational blocks below.
# Feature-owned sections (e.g. `ingest:`, `classifier:`) are appended by their
# features; where a feature needs one of the named thresholds below it MUST reference
# the value here rather than redefine it, so this file stays the single source.

# RNG seeds — reproducibility contract (non-negotiable #3). All fixed to 42.
seeds:
  numpy: 42
  xgboost: 42
  optuna: 42

# Filesystem locations.
paths:
  artefacts_dir: artefacts                       # normalisation.json, models, umap/pca
  cache_dir: cache                               # raw telemetry Parquet cache (F01)
  data_quality_log: logs/data_quality_log.jsonl  # append-only failure/fallback audit log

# Circuits withheld from ALL training, evaluated only in F20 (master spec §3.2).
# Quarantined from F00 onward; any .fit() that sees these is a build-breaking bug.
held_out_circuits: [Belgium, Italy]

# Circuit-type vocabulary (master §8.4 ENUM). F11's personalisation one-hot is DROP-FIRST over this
# list (4 types -> 3 dummies, `street` the reference), giving the master's "3D one-hot" (§7.1).
circuit_types: [street, high_speed, technical, mixed]

# The named numeric constants the constitution requires live in config.
# Canonical home for each value — feature blocks reference these, never re-declare.
thresholds:
  confidence_gate: 0.65          # classifier max-prob floor; below -> LOW_CONFIDENCE (§5.1)
  entropy_ambiguous_bits: 2.9    # Shannon entropy above -> AMBIGUOUS (§5.1)
  null_ceiling: 6                # > N NULL features -> reject vector; shared F03/F06 (§4.5)
  min_clean_laps: 30             # min clean laps per driver-circuit combination (§3.2)
  sample_rate_floor_hz: 20       # effective sampling-rate floor after interpolation (§3.3)
  laptime_bound_pct: 115         # lap-time must be within this % of driver median (§3.3)

# --- F01 data ingestion (§3.1, §8.2, §8.3) ---------------------------------
# Telemetry cache lives at paths.cache_dir (single source of truth — this block
# deliberately omits cache_dir; ingest reads paths.cache_dir). Every external call
# goes through call_with_breaker using the per-source policy below.
ingest:
  cache_max_age_days: 7            # §8.2 — use cache if fresher than this
  breakers:
    fastf1:  { timeout_s: 30, retries: 3, backoff_s: [5, 15, 30], open_after: 3, window_s: 60 }
    openf1:  { timeout_s: 10, retries: 3, backoff_s: [2, 5, 10],  open_after: 3, window_s: 60 }
    ergast:  { timeout_s: 10, retries: 2, backoff_s: [3, 8],      open_after: 2, window_s: 60 }

# --- F02 lap filter chain / validation contract (§3.2, §3.3) ---------------
# The 9-filter data-quality gate between F01's cache and F03 feature extraction.
# Shared bounds (sample_rate_floor_hz=20, laptime_bound_pct=115, min_clean_laps=30)
# live under `thresholds:` above and are referenced there, never re-declared here.
validate:
  required_channels: [Speed, Throttle, Brake, RPM, Gear]  # §3.3 LAP_003 completeness set
  green_track_status_code: "1"       # §3.3 LAP_001 — FastF1 green token; green iff every token == this
  max_consecutive_nan_pct: 10        # §3.3 LAP_003 — > N% consecutive NaN in a channel -> reject
  interp_gap_max_samples: 5          # §3.3 LAP_INTERP — gaps of 1..N consecutive NaN linear-interpolated
  min_moving_speed_kmh: 0            # §3.3 LAP_005 — speed must exceed this to count as moving
  max_stationary_fraction: 0.01      # §3.3 LAP_005 — stationary samples must be < this (>99% moving)
  degradation_features: [F27, F28]   # §3.3 LAP_PARTIAL — NULL'd when tyre age UNKNOWN

# --- F03a scalar-channel feature extraction + assembly (§4.1, §4.2, §4.5) ---
# The 22 telemetry-channel features (F01–F18, F22–F24, F26) + the shared 28-key vector
# assembly / 6-NULL tolerance gate. The NULL ceiling (null_ceiling=6) lives under
# `thresholds:` above and is referenced there, never re-declared here.
features:
  sample_period_ms: 50            # §4.2 — canonical step for "% per 50ms" rate features (F03, F08)
  throttle_full_pct: 100          # §4.2 F04 — sample counts as full throttle at >= this %
  throttle_lift_pct: 5            # §4.2 F05 — sample counts as a lift below this %
  brake_peak_top_n: 10            # §4.2 F06 — mean of top-N brake-pressure peaks
  min_braking_events: 5           # §4.2 F06/F09 — fewer braking events -> NULL
  braking_event_threshold_bar: 5  # design decision (master leaves "braking event" open) — Brake > this delimits an event
  corner_min_prominence_kmh: 10   # design decision — speed-minimum prominence delimiting a corner (F09/F11)
  overlap_throttle_pct: 5         # §4.2 F10 — throttle > this AND ...
  overlap_brake_pct: 5            # §4.2 F10 — ... brake > this => overlap sample
  overlap_cap: 0.25               # §4.2 F10 — value above -> cap to this and log (sensor fault), not NULL
  speed_p_low: 10                 # §4.2 F13 — low percentile
  speed_p_high: 90                # §4.2 F14 — high percentile
  redline_pct: 97                 # §4.2 F17 — fraction of lap above this % of session-max RPM
  min_gear_changes: 10            # §4.2 F16 — fewer gear changes -> NULL
  min_transitions: 5              # §4.2 F24 — fewer brake->throttle transitions -> NULL
  # --- F03b geometry & degradation (§4.2, §4.4) ---
  lateral_g_peak_top_n: 5         # §4.2 F20 — mean of top-N lateral-G peaks
  min_lateral_g_peaks: 5          # §4.2 F20 — fewer distinct peaks -> NULL
  lateral_g_peak_min_prominence: 0.2  # design decision — min G prominence for a "distinct" peak (F20)
  steering_g_deadband: 0.1        # design decision — |lateral G| below this ignored for F21 sign-reversals
  gravity_m_s2: 9.81              # physical constant — lateral accel (m/s^2) -> G (F19/F20/F21)
  min_stint_laps: 8               # §4.2 F27/F28 — stint with fewer usable laps -> NULL
  min_xy_finite_fraction: 0.9     # design decision — X/Y "available" iff >= this fraction of samples finite
  valid_ranges:                   # §4.2 — value outside [min,max] -> FeatureComputationError -> NULL + FEATURE_001
    F01: [0, 100]
    F02: [0, 50]
    F03: [0, 200]
    F04: [0, 1]
    F05: [0, 1]
    F06: [0, 200]
    F07: [50, 4000]
    F08: [0, 100]
    F09: [0, 380]
    F10: [0, 0.25]
    F11: [0, 200]
    F12: [0, 8000]
    F13: [0, 150]
    F14: [100, 380]
    F15: [0, 15]
    F16: [100, 10000]
    F17: [0, 0.6]
    F18: [0, 5000]
    F22: [-1, 1]
    F23: [-1, 1]
    F24: [0, 3000]
    F26: [-30, 30]
    F19: [0, 6]                  # §4.2 F19 lateral_g_mean (G)
    F20: [0, 6]                  # §4.2 F20 lateral_g_peak_mean (G)
    F21: [0, 5]                  # §4.2 F21 steering_correction_rate (reversals/s)
    F25: [0, 1]                  # §4.2 F25 corner_entry_balance (ratio)

# --- F04 circuit-aware normalisation (train-only artefact, leakage chokepoint) ---
# Z-scores the six circuit-dependent features per circuit, fitting mean/std on the TRAINING
# split ONLY and saving them to paths.artefacts_dir/normalisation.json. The per-circuit fit
# floor (min_clean_laps=30) lives under thresholds: above and is referenced, never re-declared;
# the quarantined held_out_circuits: (Belgium, Italy) are excluded before any .fit() (§4.3).
normalise:
  features: [F09, F11, F13, F14, F19, F20]  # the 6 circuit-dependent features Z-scored per circuit
  grouping_key: circuit                      # fit mean/std per circuit
  artefact_filename: normalisation.json      # written under paths.artefacts_dir
  ddof: 0                                     # population std (numpy default)
  min_std: 1.0e-8                            # std below this -> zero-variance fallback (no div-by-zero)

# --- F06a classifier training (offline; produces + registers the champion) -------
# Trains the 8-class XGBoost driver classifier, tunes with Optuna, calibrates, logs every
# trial to MLflow and registers the champion. The F06b runtime gates (confidence_gate,
# entropy_ambiguous_bits, null_ceiling) live under thresholds: and are NOT re-declared here;
# seeds: and held_out_circuits: are referenced, never redefined. CV uses StratifiedGroupKFold
# grouped by circuit (Option A — see specs/F06a §4 design note): each circuit sits wholly in one
# fold so the CV objective is leakage-clean. Dep note: full mlflow caps pandas<3, so APEX uses
# mlflow-skinny on a sqlite-backed store (the model registry does not support file:// stores).
classifier:
  cv_folds: 5                        # §5.1 K-fold count
  cv_strategy: stratified_group_kfold_by_circuit  # StratifiedGroupKFold (see §4 design note)
  cv_stratify_by: driver             # class balance across folds
  cv_group_by: circuit               # each circuit held wholly in ONE fold (true leakage guard)
  optuna_trials: 200                 # §5.1 minimum trial count (do not ship fewer)
  optuna_objective: macro_f1         # §5.1 macro-averaged F1 on the validation fold
  optuna_storage: sqlite:///artefacts/optuna_classifier.db  # §9 persistence across restarts
  calibration_method: isotonic       # §5.1 CalibratedClassifierCV method (isotonic|sigmoid)
  calibration_holdout_frac: 0.2      # disjoint calibration split (excluded from fit folds)
  baselines: [majority, logistic_regression, random_forest]  # §5.1 / §11.1 comparators
  target_macro_f1: 0.78              # §5.1 / §11.1 held-out (Belgium, Italy) target
  per_driver_floor: 0.70             # §11.1 per-driver F1 floor (below = research finding)
  mlflow_tracking_uri: sqlite:///artefacts/mlflow.db  # DB-backed store (registry needs non-file://)
  mlflow_experiment: apex-classifier # MLflow experiment name
  mlflow_registered_model: apex-driver-classifier  # champion registry name
  model_artefact_filename: classifier.pkl  # calibrated champion under paths.artefacts_dir (F06b loads)
  labels_filename: labels.json       # F06b seam — sorted driver-name list (index->name for classes_)
  confidence_high: 0.85              # F06b — max-prob >= this -> HIGH else MEDIUM (must be > confidence_gate)
  latency_warn_ms: 200               # F06b — prediction latency over this -> PERF_WARN flag (§5.1)

# --- F07 SHAP explainability (§6) ----------------------------------------------------------------
# TreeExplainer (exact) over the F06 champion's base XGBoost. Local force per prediction, global
# beeswarm artefact, 6-domain radar, top-2 natural-language style, and multi-season Jensen-Shannon
# stability. Explainability NEVER blocks a prediction: a SHAP fault degrades to SHAP_UNAVAILABLE
# (both SHAP codes are pre-seeded in errors.py §6.2). The six radar domains + their feature
# membership are structural (from §4.2) and live in code as explain.DOMAIN_FEATURES, not here.
shap:
  consistency_tolerance: 0.01        # §6.2 |base + Σshap - tree_margin| above this -> SHAP_CONSISTENCY_WARN
  nl_dominance_margin: 0.10          # §6.1/§6.2 all 6 domain scores within this rel. band -> generic desc
  nl_top_domains: 2                  # §6.1 top-N domains by |magnitude| generate the style sentence
  single_lap_warn_ms: 50             # §6.1 single-lap SHAP over this -> PERF_WARN ("< 50ms" budget)
  batch_warn_ms: 2000                # §6.1 batch-of-100 SHAP over this -> PERF_WARN ("< 2 seconds" budget)
  beeswarm_filename: shap_beeswarm.json  # §6.1 global beeswarm artefact under paths.artefacts_dir
  stability_js_bins: 20              # §6.1 histogram bins for the per-feature Jensen-Shannon divergence
  stability_min_seasons: 3           # §8.5 fewer available seasons -> partial stability (F13 -> 206)

# --- F08 Model 2 — driver style space (UMAP + PCA fallback + unknown-driver projection, §5.2) -----
# Aggregates each driver's clean NORMALISED training laps to a 56-dim distribution (mean+std of the
# 28 features), fits UMAP -> 5D fingerprint + 2D viz and a PCA fallback. Unknown drivers project by a
# forward pass (umap.transform, no retrain), gated for sparsity (SPARSE_PROJECTION, <30 laps reuses
# thresholds.min_clean_laps) and out-of-distribution (OUT_OF_DISTRIBUTION, Mahalanobis > 3 SD). The
# four §5.2 codes are pre-seeded; no new error code. min_std for the OOD/risk floor is read from
# normalise.min_std. F08 reads its OWN mlflow_tracking_uri (same store, own experiment).
stylespace:
  umap_n_components_5d: 5             # §5.2 — the fingerprint coordinate dimensionality
  umap_n_components_2d: 2             # §5.2 — the visualisation projection dimensionality
  umap_n_neighbors: 7                # §5.2 — UMAP neighbourhood; capped to n_drivers-1 at build (8 -> 7)
  umap_min_dist: 0.1                 # UMAP layout tightness (design decision; umap-learn default)
  umap_metric: euclidean             # distance on the 56-dim aggregate (design decision)
  pca_n_components: 5                # PCA fallback dims (first 2 == 2D fallback); also the OOD PC basis
  ood_sd_threshold: 3.0              # §5.2 — |z| on ANY principal component above this -> OUT_OF_DISTRIBUTION
  nearest_neighbours_k: 3            # §7.4 — top-N nearest known drivers (cosine, 5D)
  umap_model_filename: umap_model.pkl    # §5.2 — under paths.artefacts_dir (+ .sha256 sidecar)
  pca_model_filename: pca_fallback.pkl   # §5.2 — under paths.artefacts_dir
  stability_n_runs: 10               # §5.2/§11.2 — UMAP runs (fixed seed sequence) for Procrustes stability
  stability_variance_threshold: 0.05 # §11.2 — Procrustes-aligned variance target (dissertation)
  mlflow_tracking_uri: sqlite:///artefacts/mlflow.db  # #3 — F08's OWN URI (same store as F06a, own experiment)
  mlflow_experiment: apex-stylespace # #3 — build run logged here

# --- F10 Model 3 — tyre degradation detector (statistical, within-stint, §5.3) --------------------
# Per-lap cosine deviation (F04-normalised then F10 train-only-standardised 26-dim space; F27/F28
# excluded from the cosine core, entering via the live-window slope component) vs a first-3-clean-laps
# baseline, 3-lap rolling mean, τ = μ + alert_threshold_sd·σ per driver per circuit type from
# artefacts/stint_variation.json (train-only, content-hashed, timestamp-free). The activation/slope
# floor is features.min_stint_laps, the exclusion set is validate.degradation_features, and the σ
# floor is normalise.min_std — referenced, never re-declared. The six §5.3 codes are pre-seeded in
# errors.py; no new error code. F10 reads its OWN mlflow_tracking_uri (same store, own experiment).
monitoring:
  baseline_laps: 3                   # §5.3 — baseline fingerprint = first N clean laps of stint
  baseline_window_extended: 5        # §5.3 failure table — candidate window when <N clean in first N
  rolling_window: 3                  # §5.3 — N-lap rolling mean of cosine distance
  alert_threshold_sd: 2.0            # §5.3 — τ = μ + N·σ of historical intra-stint variation
  alert_confirm_laps: 2              # §5.3 — consecutive laps above τ before the alert fires
  max_consecutive_nan: 3             # §5.3 failure table — N consecutive NaN distances -> MONITOR_ERROR
  slope_weight: 0.25                 # §5.3 weighted F27/F28 component — value master-silent (divergence #8)
  confidence_medium_sd: 2.5          # alert band: s >= μ + N·σ -> MEDIUM (master-silent, divergence #9)
  confidence_high_sd: 3.0            # alert band: s >= μ + N·σ -> HIGH  (master-silent, divergence #9)
  min_calibration_stints: 3          # cell usable only with >= N training stints (master-silent, divergence #12)
  attribution_top_k: 3               # alert banner "feature drivers" count (§10.7)
  sensitivity_grid_sd: [1.0, 1.5, 2.0, 2.5]   # §11.3 threshold sensitivity grid (verbatim)
  variation_artefact_filename: stint_variation.json   # §5.3 /artefacts/stint_variation.json
  mlflow_tracking_uri: sqlite:///artefacts/mlflow.db  # F10's OWN URI (same store, own experiment)
  mlflow_experiment: apex-degradation                 # calibration runs logged here

# --- F11 Model 4 — car personalisation engine (3 layers: mapping, constraints, confidence, §7) ----
# One XGBoost regressor per setup parameter (input = F08 5D fingerprint + drop-first circuit one-hot);
# a constraint layer (FIA clip / Monaco override / consistency flag / <0.5 confidence -> WIDE range);
# a confidence layer (per-parameter reliability = 1 - CV-nRMSE, OOD-attenuated, never NULL). Setup
# TARGETS are approximated from telemetry, never measured (§15.2). The four §7 codes are pre-seeded in
# errors.py; no new error code. F11 reads its OWN mlflow_tracking_uri (same store, own experiment).
personalisation:
  top_quartile_pct: 0.25             # §7.1 "best-performing stints" = fastest-quartile clean laps (div #14)
  confidence_floor: 0.5              # §7.2 — reliability < this per parameter -> WIDE range, not a point
  confidence_medium: 0.65           # rating band: r >= this -> MEDIUM (master-silent, div #17)
  confidence_high: 0.80             # rating band: r >= this -> HIGH  (master-silent, div #17)
  wide_range_pct: 0.15              # §7.2 — WIDE range = ±N of the predicted value
  ood_sd_threshold: 3.0             # §4.0-c — onboarding OOD attenuation onset (PC-SD)
  ood_floor: 0.3                    # §4.0-c — confidence-attenuation floor for a fully-OOD unknown driver
  consistency_front_wing_deg: 10.0  # §7.2 — extreme front-wing threshold for the consistency check
  consistency_brake_bias_pct: 54.0  # §7.2 — very-low brake-bias threshold
  monaco_circuit: Monaco            # §7.2 — the hard max-downforce override circuit
  shap_top_k: 3                     # §6.1 — top fingerprint drivers per parameter (Screen 2 panel)
  cv_folds: 5                       # GroupKFold-by-driver reliability CV (div #17)
  model_artefact_filename: personalisation.pkl        # under paths.artefacts_dir
  mlflow_tracking_uri: sqlite:///artefacts/mlflow.db  # F11's OWN URI (same store, own experiment)
  mlflow_experiment: apex-personalisation             # training runs logged here
  fia_bounds:                        # §7.3 per-parameter legal (min, max)
    front_wing_angle: [0.0, 12.0]
    rear_wing_angle: [0.0, 15.0]
    brake_bias: [52.0, 62.0]
    differential_ramp_entry: [1.0, 10.0]
    differential_ramp_exit: [1.0, 10.0]
    throttle_map_curve: [1.0, 9.0]
    suspension_stiffness_front: [0.0, 2.0]
    suspension_stiffness_rear: [0.0, 2.0]
    tyre_warmup_laps: [1.0, 5.0]
    brake_duct_aperture: [30.0, 100.0]

# --- F09 corner-type decomposition + sub-fingerprints (ablation, §4.4) ----------------------------
# Each lap's corners (F03a _corner_indices apices + F25 speed-maxima windows) are classified by apex
# radius r = 1/max(curvature) — reusing F03b's curvature primitive — into slow/medium/high-speed, and
# each type yields a 5-feature sub-vector aggregated per (driver, corner_type) into the Screen-2
# sub-fingerprints. The ablation compares base (28) vs expanded (28+15) classifier macro-F1. X/Y
# unavailable -> CORNER_001 skip (F03b's behaviour; lap continues). CORNER_001 is pre-seeded; no new
# error code. The curvature/segmentation knobs + min_xy_finite_fraction live under features: above.
corners:
  radius_slow_max: 100.0             # §4.4 — apex radius (m) below this -> SLOW corner
  radius_medium_max: 200.0           # §4.4 — below this -> MEDIUM; at/above -> HIGH_SPEED
  min_corners_per_type: 5            # sub-fingerprint cell needs >= N corners of the type (div #20)
  ablation_margin: 0.01              # macro-F1 delta band for IMPROVES/NEUTRAL/DEGRADES (div #21)
  cv_folds: 5                        # ablation CV (mirrors classifier.cv_folds)
  subfingerprint_artefact_filename: corner_subfingerprints.json  # under paths.artefacts_dir
  mlflow_tracking_uri: sqlite:///artefacts/mlflow.db  # F09's OWN URI (same store, own experiment)
  mlflow_experiment: apex-ablation                    # sub-fingerprint build + ablation runs

# --- F12 persistence layer (PostgreSQL schema + Alembic migrations, §8.3/§8.4/§9) -----------------
# The 10 master-§8.4 tables (app/db/models.py) + the Alembic migration that materialises them + the
# async engine/session + DB circuit breaker + health probe. The DSN is a SECRET sourced from the
# environment variable named below (dsn_env_var) — never committed here (§9 RLS / secret hygiene);
# see .env.example. The breaker mirrors the master §8.3 Supabase-PostgreSQL policy VERBATIM and is a
# BreakerConfig driven by F12's async sibling of F01's call_with_breaker -> DB_UNAVAILABLE. schema_name
# is null for the default schema (SQLite unit suite + single-instance deploy); §12.2 shared-instance
# deploys set apex_schema. The offline unit suite runs on aiosqlite and never reads these DSNs.
database:
  dsn_env_var: APEX_DATABASE_URL           # env var holding the async DSN (e.g. postgresql+psycopg://…)
  test_dsn_env_var: APEX_TEST_DATABASE_URL # env var whose presence enables the marked migration test
  schema_name: null                        # null = default schema; §12.2 sets apex_schema
  migrations_path: migrations              # Alembic script_location
  pool_size: 5                             # async engine pool size (design decision)
  max_overflow: 10                         # overflow connections beyond pool_size (design decision)
  pool_timeout_s: 30                       # wait for a pooled connection before erroring (design decision)
  statement_timeout_s: 5                   # §8.3 — server-side per-statement cap (Supabase timeout)
  echo: false                              # SQL echo (debug only)
  breaker: { timeout_s: 5, retries: 3, backoff_s: [1, 2, 4], open_after: 3, window_s: 30 }  # §8.3 verbatim
